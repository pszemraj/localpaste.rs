# LoC exceptions for check-loc.
#
# Each exception must include:
# - path: workspace-relative Rust file path
# - max_lines: temporary per-file cap for that path
# - reason: concrete rationale for why the exception exists
#
# Example:
# [[exceptions]]
# path = "crates/localpaste_gui/src/app/mod.rs"
# max_lines = 1200
# reason = "Temporary during editor state extraction work"

[[exceptions]]
path = "crates/localpaste_gui/src/app/state_ops.rs"
max_lines = 1140
reason = "Temporary production state-machine exception while extracting backend event handling, search dispatch/projection, and selection transitions into focused state_ops submodules."

[[exceptions]]
path = "crates/localpaste_gui/src/app/version_ui.rs"
max_lines = 1100
reason = "Temporary production version-workflow exception while extracting snapshot/diff caches, history-reset fencing, and version event handling into focused version_ui submodules."
